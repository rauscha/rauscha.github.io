# GitHub Pages (Jekyll) configuration.
#
# The site is plain static HTML/CSS/JS — Jekyll simply copies it through.
# Keeps non-site files out of the published pages: the CV source (cv/) and
# generated .docx are excluded; only Andrew_Rausch_CV.pdf is served.
exclude:
  - Andrew_Rausch_CV.docx
  - docs/
  - cv/
