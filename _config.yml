# GitHub Pages (Jekyll) configuration.
#
# The site is plain static HTML/CSS/JS — Jekyll simply copies it through.
# This file exists only to keep the editable CV source out of the published
# site: Andrew_Rausch_CV.docx is the source of truth for the CV, but only the
# generated Andrew_Rausch_CV.pdf is served. Edit the .docx, re-export the PDF.
exclude:
  - Andrew_Rausch_CV.docx
